		#autoLOC_6011015 = 如果专家们判断没错，这是这颗行星上最古老的树木之一……也许和冯·坎曼教授一样古老。
		#autoLOC_6011016 = 从这棵古树上取一圈年轮样本，将提供数百年的珍贵气候数据。但能否在不伤害这棵老猴面包树的前提下采集呢？
		#autoLOC_6011017 = 虽然坎星上还有其他树木，但这些无疑是最有趣的。它们实在太显眼，有时几乎让人看不见别的树。
		#autoLOC_6011018 = 这巨大的水晶构造像镜子一样闪闪发光，能提供宝贵的信息——前提是鲍勃别盯着自己的倒影看太久，肯动手采集。
		#autoLOC_6011019 = 这些石英构造至今仍是个谜。我们的一些科学家在琢磨，如此巨大的结构怎么会在这里形成；另一些人则在想自己是不是选错了行，当初该去当珠宝匠。
		#autoLOC_6011020 = 这些石英构造只出现在坎星较难抵达的区域。它们是害羞吗？还是过去有什么事情发生在了那些容易到达的石英上？
		#autoLOC_6011021 = 这奇特的构造看上去几乎被风化了，这在低重力天体上完全不可能。进一步研究也许能提供关键线索。
		#autoLOC_6011022 = 这些奇怪的陨石散落在艾克表面各处，暗示着杜娜和艾克早期都经历过极其剧烈的历史。
		#autoLOC_6011023 = 除了提供艾克与杜娜史前的宝贵数据外，“艾克石”宠物现在在坎星老家可是大受欢迎。
		#autoLOC_6011024 = 在低重力卫星上竟能堆积出这样一堆东西，实在令人好奇。进一步分析可为波普的起源——究竟是天然卫星还是被捕获的卫星——提供宝贵线索。
		#autoLOC_6011025 = 波尔那些巨大的石柱本就违背一切逻辑。也许弄清这些特定碎片如何崩裂，我们就能知道它们究竟是如何形成的？
		#autoLOC_6011026 = 这些小碎片似乎与波尔巨大石柱的成分相同。但究竟是什么把它们弄断的？海妖？
		#autoLOC_6011027 = 所有证据都指向明玛斯曾经拥有数片液态海洋，而物理定律表明这不可能！研究这些奇怪的小石头将为这个谜团提供宝贵线索。
		#autoLOC_6011028 = 要想说服老家人相信这些不是薄荷味糖霜饼干，真的很难。
		#autoLOC_6011029 = 一片从盐滩上突出来的橄榄石构造……居然是在一颗没有大气的低重力卫星上？又一条不可能的证据，说明明玛斯也许曾经有过……海洋？？？
		#autoLOC_6011030 = 这个巨大的构造能提供大量宝贵数据。但对实验室那帮人来说更重要的是：在这么低的重力下，你能一跳就跳到顶吗？
		#autoLOC_6011031 = 说来奇怪，这些石头看起来更像光滑的河卵石，而不是陨石碎片。进一步分析会很有价值。
		#autoLOC_6011032 = 如果明玛斯是薄荷冰淇淋做的，我们可以用这些小棕石当巧克力碎——前提是我们愿意把它们带过去。我们有绕路的 delta-v 吗？
		#autoLOC_6011033 = 说来奇怪，这冷却的岩浆看起来像一层层美味的巧克力热软糖。
		#autoLOC_6011034 = 这美妙的岩浆流如今已经冷却，看起来几乎像有机物。
		#autoLOC_6011035 = 相对于它的体积轻得不可思议，让人不禁想知道这块浮石般的石头能不能真的浮在 Eve 那古怪的粉红色海洋上。
		#autoLOC_6011036 = 与坎星上发现的火山玻璃相似，分析这个迷人的样本应能为 Eve 的火山历史提供宝贵信息。
		#autoLOC_6011037 = 这样的构造在坎星上很罕见。我们的一些科学家推测，Eve 更剧烈的过去与它们的形成有关。
		#autoLOC_6011038 = 哪位科学家第一个看到这些巨大的圆顶构造并想到“这让我想起了早餐”，大概得了什么奖吧。
		#autoLOC_6011039 = 这块杜娜石头和我们在杜娜上见过的其他石头差不多。但既然是你找到的，它就具有了特殊意义，将载入坎巴拉航天史。也许还能在拍卖行卖个好价钱。
		#autoLOC_6011040 = 杜娜稀薄的大气几乎挡不住这些陨石，它们撞上杜娜后散落在其表面。虽然我们来杜娜是为了研究这颗行星本身，但何不顺便采样另一个天体的成分呢？
		#autoLOC_6011041 = 杜娜稀薄的风将细沙卷入巨大的风暴，在整个行星上留下这些沙丘沉积。对科学家来说棒极了——但想从泳衣里弄出来可就糟透了。
